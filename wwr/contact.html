<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description" content="Get in touch with White Water Rafting Company for trip reservations, general inquiries, directions, and customer support.">
    <meta name="author" content="Oscar Izquierdo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-grid">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d692427.4316010252!2d-122.61057122812636!3d37.849449302986535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1s123%20Main%20River%20Street%20%20Kolob%2C%20California!5e1!3m2!1sen!2smx!4v1795630006077!5m2!1sen!2smx" width="400" height="350" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="White Water Rafting Company Location">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Your full name" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="you@example.com" required>
                </div>

                <fieldset class="form-item radio-group">
                    <legend>Message Purpose</legend>
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general" required>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Portrait of Sarah Connor">
                <figcaption>Sarah Connor — Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Portrait of Marcus Athony">
                <figcaption>Marcus Athony — Trip Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Portrait of Elena de Troya">
                <figcaption>Elena de Troya — Safety Director</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | White Water Rafting Company | Oscar Izquierdo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
