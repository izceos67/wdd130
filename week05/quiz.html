<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1"><strong>1.</strong> What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-item">
                <label for="q2"><strong>2.</strong> How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <!-- Question 3: Select Dropdown -->
            <div class="form-item">
                <label for="q3"><strong>3.</strong> Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="slash-star">/* This is a comment */</option>
                    <option value="double-slash">// This is a comment</option>
                    <option value="html-comment">&lt;!-- This is a comment --&gt;</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-item">
                <label for="q4"><strong>4.</strong> What is the bottom margin given this declaration? <code>margin: 10px 5px 15px;</code></label>
                <input type="number" id="q4" name="q4" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
